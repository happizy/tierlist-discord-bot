[project]
name = "tierlist-discord-bot"
version = "0.1.0"
description = "A self-hosted Discord bot for shared, image-based tier lists"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.6,<3",
    "Pillow>=12,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
